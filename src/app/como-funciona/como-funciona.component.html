<section class="how-it-works">
  <div class="container">
    <div class="header">
      <h2>Cómo funciona</h2>
      <p>Protección instantánea en tres simples pasos</p>
    </div>

    <div class="steps">
      <div class="card" *ngFor="let step of steps; let i = index">
        <div class="icon">{{ step.icon }}</div>
        <div class="number">{{ i + 1 }}</div>
        <h3>{{ step.title }}</h3>
        <p>{{ step.description }}</p>
      </div>
    </div>
  </div>
</section>
